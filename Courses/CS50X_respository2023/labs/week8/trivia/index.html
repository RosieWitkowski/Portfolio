<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="stylesTrivia.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            // TODO: Add code to check answers to questions
            document.addEventListener('DOMContentLoaded', function(){
                let correct = document.querySelector('#correctButton');
                let incorrect1 = document.querySelector('#incorrectButton1');
                let incorrect2 = document.querySelector('#incorrectButton2');

                let response = document.querySelector('#responseText');
                correct.onclick = function(){
                    correct.style = 'background-color: rgb(0,255,0)';
                    response.innerHTML = "Correct!";
                }
                incorrect1.onclick = function(){
                    incorrect1.style = 'background-color: rgb(255,0,0)';
                    response.innerHTML = "Incorrect.";
                }
                incorrect2.onclick = function(){
                    incorrect2.style = 'background-color: rgb(255,0,0)';
                    response.innerHTML = "Incorrect.";
                }

                let confirmButton = document.querySelector('#confirmButton');
                let responseText2 = document.querySelector('#responseText2');
                confirmButton.onclick = function(event){
                    let inputText = document.querySelector('#textInput')
                    if (inputText.value.toLowerCase().localeCompare("pig") == 0)
                    {
                        inputText.style = "background-color: rgb(0,255,0)";
                        responseText2.innerHTML = "Correct!";
                    }
                    else
                    {
                        inputText.style = "background-color: rgb(255,0,0)";
                        responseText2.innerHTML = "Incorrect.";
                    }
                    event.preventDefault();
                }
            });

        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <h3>What year was Minecraft:Java released?</h3>
                <button id='incorrectButton1'>2007</button>
                <button id='incorrectButton2'>2002</button>
                <button id="correctButton">2011</button>
                <h3 id = "responseText"></h3>
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <h3>What animal were Creepers developed from?</h3>
                <form>
                    <input type="text" id="textInput" autocomplete="off">
                    <input type="submit" value = "confirm" id="confirmButton">
                </form>
                <h3 id = 'responseText2'></h3>
            </div>
        </div>
    </body>
</html>
