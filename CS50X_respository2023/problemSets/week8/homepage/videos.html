<!DOCTYPE html>

<html lang="en">
    <head>
        <meta name = "viewport" content="initial-scale=1, width=device-width">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
        <link href="stylesPS8.css" rel="stylesheet">
        <title>My Webpage</title>
        <script>
            document.addEventListener("DOMContentLoaded", function(){
             let diamonds = 0
             document.querySelector("#diamondsButton").onclick = function(){
                 let diamondsMined = document.querySelector('#diamondsMined');
                 let possible = Math.floor(Math.random() * 3);
                 if (possible == 2)
                 {
                     diamonds += 1;
                     diamondsMined.innerHTML = diamonds;
                 }
             }
         })
         </script>
    </head>
    <body>
        <h1 class="title">Minecraft

            <div style="float: right">
                <button type="button" id="diamondsButton" style="background: none; border:none"><img src="minecraft_diamond.png"></button>
                <p class="diamondsButton">
                    Diamonds mined:
                    <p id="diamondsMined" class="diamondsButton" style='text-align: center'>0</p>
                </p>
            </div>

            </h1>

        <div class="navHolder">
            <a href="index.html"><button type="button" class="navBar">Home</button></a>
            <a href="gallery.html"><button type="button" class="navBar">Gallery</button></a>
            <a href="videos.html"><button type="button" class="navBar">Videos</button></a>
            <a href="smp.html"><button type="button" class="navBar">SMP</button></a>
        </div>

        <div class="textSection">
            Watch a couple short videos, recorded in Minecraft, here!
            <table>
                <tr>
                    <td style="padding-top: 25pt">
                        <video controls width = "640px" height="540px" muted>
                            <source src="infinite slime trampoline short loop.mp4" type="video/mp4">
                        </video>
                    </td>
                    <td style="padding-top: 25pt">
                        <video controls width = "640px" height="540px" muted>
                            <source src="minecraft arrow short (editted).mp4" type="video/mp4">
                        </video>
                    </td>
                </tr>
            </table>
        </div>
    </body>
</html>
